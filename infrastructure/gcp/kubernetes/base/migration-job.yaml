apiVersion: batch/v1
kind: Job
metadata:
  name: bookwise-migrate
  namespace: bookwise
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookwise-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: bookwise-migrator
      containers:
        - name: migrate
          image: bookwise-migrator:local
          envFrom:
            - configMapRef:
                name: bookwise-runtime
            - secretRef:
                name: bookwise-runtime
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
