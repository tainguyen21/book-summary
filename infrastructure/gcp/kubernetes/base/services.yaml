apiVersion: v1
kind: Service
metadata:
  name: bookwise-web
  namespace: bookwise
spec:
  selector:
    app.kubernetes.io/name: bookwise-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: bookwise-api
  namespace: bookwise
spec:
  selector:
    app.kubernetes.io/name: bookwise-api
  ports:
    - name: http
      port: 3001
      targetPort: http
