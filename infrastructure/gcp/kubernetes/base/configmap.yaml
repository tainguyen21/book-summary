apiVersion: v1
kind: ConfigMap
metadata:
  name: bookwise-runtime
  namespace: bookwise
data:
  OBJECT_STORAGE_PROVIDER: gcs
  GCS_BUCKET: bookwise-509408-storage
  GOOGLE_CLOUD_PROJECT: bookwise-509408
  GOOGLE_CLOUD_LOCATION: global
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  BOOKWISE_MODEL_PROVIDER: vertex
  BOOKWISE_SUMMARY_MODEL: gemini-3.8-flash
  BOOKWISE_EMBEDDING_MODEL: gemini-embedding-001
  BOOKWISE_EMBEDDING_DIMENSIONS: "768"
  # Region for the API's interactive query embeddings (search); same vectors as global.
  BOOKWISE_EMBEDDING_LOCATION: asia-southeast1
  BOOKWISE_MODEL_TIMEOUT_SECONDS: "120"
  BOOKWISE_MODEL_MAX_OUTPUT_TOKENS: "16384"
  # USD per 1M tokens, used only for estimated spend. List (non-promotional)
  # Vertex rates; confirm against the official pricing page.
  BOOKWISE_MODEL_PRICING_JSON: '{"gemini-3.8-flash":{"input_per_mtok":1.50,"output_per_mtok":7.50},"gemini-embedding-001":{"input_per_mtok":0.15,"output_per_mtok":0}}'
  BOOKWISE_GENERATION_CHUNK_CHARS: "12000"
  # Estimated USD per local day before summary generation pauses; "0" disables.
  BOOKWISE_DAILY_BUDGET_USD: "2"
  BOOKWISE_BUDGET_TIMEZONE: Asia/Saigon
  PROCESSING_BATCH_LIMIT: "1"
  PROCESSING_POLL_INTERVAL_SECONDS: "2"
  CLOUD_SQL_INSTANCE: bookwise-509408:asia-southeast1:bookwise-postgres
  PORT: "3001"
  WEB_ORIGIN: https://tai-dev-web.cloud
