apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookwise-worker
  namespace: bookwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookwise-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookwise-worker
    spec:
      serviceAccountName: bookwise-worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: bookwise-worker:local
          envFrom:
            - configMapRef:
                name: bookwise-runtime
            - secretRef:
                name: bookwise-runtime
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - --structured-logs
            - $(CLOUD_SQL_INSTANCE)
          envFrom:
            - configMapRef:
                name: bookwise-runtime
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
