[project]
name = "bookwise-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4",
  "boto3",
  "celery[redis]",
  "ebooklib",
  "httpx",
  "lxml",
  "openai",
  "pgvector",
  "pydantic",
  "pydantic-settings",
  "psycopg[binary]",
  "pymupdf",
  "python-docx",
  "sqlalchemy"
]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookwise_data"]
