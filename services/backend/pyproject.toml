[project]
name = "bookwise-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "boto3",
  "celery[redis]",
  "fastapi",
  "httpx",
  "pgvector",
  "pydantic-settings",
  "psycopg[binary]",
  "sqlalchemy",
  "uvicorn"
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookwise"]
