name: Verify

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web build
        env:
          NEXT_PUBLIC_AUTH0_DOMAIN: your-tenant.us.auth0.com
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ci-placeholder-client-id
          NEXT_PUBLIC_AUTH0_AUDIENCE: https://api.bookwise.local
          NEXT_PUBLIC_AUTH0_REDIRECT_URI: http://localhost:3000
      - run: pnpm --dir services/api lint
      - run: pnpm --dir services/api build
      - run: pnpm --dir services/api format:check
      - run: uv sync --project services/data --locked
      - run: uv run --project services/data ruff check services/data
      - run: uv run --project services/data python -m compileall -q services/data/src
      - run: docker compose config
      - run: docker compose up -d postgres
      - run: ./infrastructure/database/migrate.ps1 -DatabaseUrl postgresql://bookwise:bookwise@localhost:5432/bookwise_next
        shell: pwsh
