name: Verify

on:
  pull_request:
  workflow_call:
    inputs:
      api_url:
        type: string
        required: false
      auth0_domain:
        type: string
        required: false
      auth0_client_id:
        type: string
        required: false
      auth0_audience:
        type: string
        required: false
      auth0_redirect_uri:
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Full history, so secret scanning covers every commit.
          fetch-depth: 0
      # Secret scanning over the whole history; reviewed false positives live
      # in .gitleaksignore. Findings are redacted in the log.
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
      # Known vulnerabilities with a fix in the lockfiles. CRITICAL blocks;
      # the weekly security scan reports HIGH as well.
      - name: Scan dependencies for critical vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.76.0
          fs --quiet --scanners vuln --severity CRITICAL --ignore-unfixed
          --exit-code 1 /repo
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || 'http://localhost:3001' }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ inputs.auth0_domain || 'your-tenant.us.auth0.com' }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ inputs.auth0_client_id || 'ci-placeholder-client-id' }}
          NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ inputs.auth0_audience || 'https://api.bookwise.local' }}
          NEXT_PUBLIC_AUTH0_REDIRECT_URI: ${{ inputs.auth0_redirect_uri || 'http://localhost:3000' }}
      - run: pnpm --dir services/api lint
      - run: pnpm --dir services/api build
      - run: pnpm --dir services/api format:check
      - run: uv sync --project services/data --locked
      - run: uv run --project services/data ruff check services/data
      - run: uv run --project services/data python -m compileall -q services/data/src
      - run: docker compose config
      - run: docker compose up -d postgres
      - run: ./infrastructure/database/migrate.ps1 -DatabaseUrl postgresql://bookwise:bookwise@localhost:5432/bookwise_next
        shell: pwsh
