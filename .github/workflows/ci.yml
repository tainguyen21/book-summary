name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/backend
      - run: docker compose config
      - run: pnpm --dir apps/web test
      - run: uv run --project services/backend pytest services/backend/tests/test_package_import.py -v
