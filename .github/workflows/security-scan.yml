name: Security scan

# Weekly (and on demand): fixable HIGH and CRITICAL vulnerabilities in the
# lockfiles and the base images, plus secret scanning. A failure here emails
# the repository owner without blocking deploys; fix it in a normal change.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
      - name: Scan dependencies
        run: >-
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.76.0
          fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 /repo
      - name: Scan base images
        run: |
          for image in python:3.12-slim node:24-bookworm-slim; do
            docker run --rm aquasec/trivy:0.76.0 image --quiet --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
